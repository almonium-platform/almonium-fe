<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Almonium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo/logo-flat.svg">
  <script>
    (() => {
      try {
        const preferences = JSON.parse(localStorage.getItem('app_preferences') || '{}');
        const theme = ['light', 'dark', 'system'].includes(preferences.appearance) ? preferences.appearance : 'system';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('reduce-motion', Boolean(preferences.reduceMotion));
        document.documentElement.style.colorScheme = theme === 'system' ? 'light dark' : theme;
      } catch {
        document.documentElement.dataset.theme = 'system';
        document.documentElement.style.colorScheme = 'light dark';
      }
    })();
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-726SZFQZWB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-726SZFQZWB');
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#693651">
</head>
<body>
<app-root></app-root>
<noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
