<ng-template #shareLink>
  <div class="popup-container">
    <h1 class="popup-header">{{ title }}</h1>

    <app-qr-code class="qr" [linkToEncode]="link" (click)="copy()"></app-qr-code>

    <div class="separator"></div>
    <div class="share-link-container">
      <input
        type="text"
        class="share-link-input"
        [value]="fieldText"
        (click)="copy()"
        readonly
      />
      <button
        type="button"
        class="copy-action"
        [class.copied]="showCopied"
        [attr.aria-label]="copyActionLabel"
        (click)="copy()"
      >
        <tui-icon [icon]="showCopied ? '@tui.check' : '@tui.copy'"></tui-icon>
        <span i18n aria-live="polite">{showCopied, select, true {Copied} other {Copy}}</span>
      </button>
    </div>
  </div>
</ng-template>
