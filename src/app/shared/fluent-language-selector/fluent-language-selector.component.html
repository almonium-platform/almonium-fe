<div class="">
  <div class="">
    <tui-textfield
      multi
      tuiChevron
      class="cefr-select"
      [class.fluent-disabled]="atLanguageLimit"
    >
      <input
        #chipInput
        tuiInputChip
        [formControl]="fluentLanguageControl"
        [placeholder]="atLanguageLimit ? 'Limit reached' : ((fluentLanguageControl.value?.length ?? 0) ? '' : 'Start typing...')"
        [attr.aria-disabled]="atLanguageLimit"
        (input)="onType($event)"
        (keydown)="trapSeparators($any($event))"
        (keydown.enter)="onEnter($any($event))"
      />
      <!-- default chip view (remove if you use a custom chip component) -->
      <tui-input-chip *tuiItem/>

      @if (filteredFluentLanguages$ | async; as items) {
        <tui-data-list-wrapper
          *tuiDropdown
          new
          tuiMultiSelectGroup
          [items]="items"
          (itemClick)="onPick($event.item)"
        />
      }
    </tui-textfield>

    <tui-error
      [formControl]="fluentLanguageControl"
    />
    @if (showLimitMessage && maxLanguages === 1 && atLanguageLimit) {
      <div class="limit-message tui-text_m tui-text_negative tui-space_top-2">
        Free plan lets you pick only one fluent language.
      </div>
    }
  </div>
</div>
