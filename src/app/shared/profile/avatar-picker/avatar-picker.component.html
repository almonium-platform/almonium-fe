<section class="avatar-picker" [class.member]="userInfo.premium">
  <span class="current-avatar onboarding-current {{ currentDisc }}">
    @if (userInfo.avatarUrl) {
      @if (premiumCurrentAvatar) {
        <span class="gradient-artwork" [style.mask-image]="currentAvatarMask" [style.-webkit-mask-image]="currentAvatarMask" role="img" aria-label="Selected avatar"></span>
      } @else {
        <img [src]="displayAvatarUrl" alt="Selected avatar" />
      }
    } @else {
      <span>{{ letter }}</span>
    }
  </span>

  <!--
    28b: the letter is one option among six here, drawn in the same monochrome material as the
    five engravings. No hashed hue on a step called "Make it yours" - the colour is not a choice.

    30: the choice discs are 40px, below the 48 the engraving reads at, so they draw the
    schematics; the engraving of the chosen one is the big disc above.
  -->
  <div class="compact-choices" aria-label="Choose an avatar">
    <button
      type="button"
      class="compact-choice letter-choice avatar-ground"
      [class.selected]="!userInfo.avatarUrl"
      [disabled]="busyUrl !== undefined"
      (click)="useLetter()"
      aria-label="Use letter"
      [attr.aria-pressed]="!userInfo.avatarUrl"
    ><span>{{ letter }}</span></button>
    @for (choice of choices; track choice.path) {
      <button
        type="button"
        class="compact-choice animal-choice avatar-plate"
        [class.selected]="isSelected(choice)"
        [disabled]="busyUrl !== undefined"
        (click)="chooseAvatar(choice)"
        [attr.aria-label]="'Use ' + choice.label + ' avatar'"
        [attr.aria-pressed]="isSelected(choice)"
      >
        @if (userInfo.premium) {
          <span class="gradient-artwork avatar-schematic" [style.mask-image]="smallMask(choice)" [style.-webkit-mask-image]="smallMask(choice)"></span>
        } @else {
          <img class="avatar-schematic" [src]="choice.small" alt="" />
        }
      </button>
    }
  </div>
  <p class="picker-caption">Your letter, or one of five drawings.</p>
</section>
