<section>
  @if (loading) {
    @for (item of skeletonItems; track $index) {
      <span tuiChip size="s" tuiSkeleton class="interest-skeleton">Loading topic</span>
    }
  }
  @for (interest of interests; track interest) {
    <label
      tuiChip
      size="s"
      [appearance]="interest.selected ? 'neutral' : 'floating'"
      [class.selected]="interest.selected"
    >
      <input
        hidden
        type="checkbox"
        [(ngModel)]="interest.selected"
        (ngModelChange)="onInterestChange()"
      />
      {{ interest.name }}
    </label>
  }
</section>
