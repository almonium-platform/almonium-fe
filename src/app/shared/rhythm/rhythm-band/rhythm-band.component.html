<div class="band-strip" [style.--crest-color]="crest">
  <span class="strip-crest">{{ rhythm.language }}</span>
  <div
    class="bars"
    role="img"
    [attr.aria-label]="weeksMet + ' of the last ' + rhythm.weeks.length + ' weeks at pace in ' + rhythm.language"
  >
    @for (week of rhythm.weeks; track week.weekStart) {
      <i
        class="bar"
        [class.met]="week.met"
        [class.partial]="!week.met && week.daysMet > 0"
        [class.current]="isCurrent(week)"
      ></i>
    }
  </div>
  <span class="caption">{{ caption }}</span>
</div>
