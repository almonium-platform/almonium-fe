<div class="target-row" role="radiogroup" [attr.aria-label]="label">
  <span class="target-label">{{ label }}</span>
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      class="target-pill"
      [class.selected]="target === option.value"
      [class.none]="option.value === 0"
      [attr.aria-checked]="target === option.value"
      [disabled]="saving || !editable"
      (click)="choose(option.value)"
    >{{ option.label }}</button>
  }
</div>
