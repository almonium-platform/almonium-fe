<form (ngSubmit)="onSubmit()" class="username-editor">
  <div class="username-control" [class.invalid]="usernameControl.touched && usernameControl.invalid">
    <input
      type="text"
      [formControl]="usernameControl"
      (blur)="onSubmit()"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      maxlength="25"
      aria-label="Username"
    />
    @if (availabilityText) {
      <span
        class="availability"
        [class.available]="availabilityText === 'available'"
        [class.taken]="availabilityText === 'taken'"
        aria-live="polite"
      >{{ isSaving ? 'saving' : availabilityText }}</span>
    }
  </div>
  @if (errorText) {
    <p class="username-error" aria-live="polite">{{ errorText }}</p>
  }
</form>
