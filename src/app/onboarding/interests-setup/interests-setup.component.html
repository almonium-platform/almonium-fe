<div class="card step">
  <div i18n class="tui-header header-row">
    What do you like to read?
  </div>

  <app-interests
    [currentInterests]="initialInterests"
    class="content"
    (selectedInterestsChange)="onSelectedInterestsChange($event)">
  </app-interests>

  <div class="step-actions">
    <app-button label="Continue" i18n-label (click)="submit()" appearance="solid" [satisfiable]="atFloor" [loading$]="loading$" />
    <button i18n type="button" class="back-link" (click)="back.emit()">Back</button>
  </div>
  @if (!atFloor) {
    <p i18n class="floor-note">Pick three or more so Almo has something to go on. Fewer works too.</p>
  }
</div>
