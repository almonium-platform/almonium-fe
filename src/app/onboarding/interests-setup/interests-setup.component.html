<div class="card step">
  <div class="tui-header header-row">
    What do you like to read?
  </div>

  <app-interests
    [currentInterests]="currentInterests"
    class="content"
    (selectedInterestsChange)="onSelectedInterestsChange($event)">
  </app-interests>

  <app-button
    label="Start reading"
    (click)="submit()"
    appearance="gradient"
    class="w-full"
    [loading$]="loading$"
    [disabled]="selectedInterests.length < 3"
  >
  </app-button>
</div>
