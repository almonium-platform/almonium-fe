<div class="card step greeting-step">
  <img src="assets/img/almo/canon-512.webp" alt="Almo, ready to read with you" />
  <div>
    <h1>You're all set, {{ userInfo?.username }}.</h1>
    <p>{{ setupSummary }}</p>
  </div>
  <app-button label="Start reading" appearance="solid" class="w-full" [loading$]="loading$" (click)="startReading()" />
</div>
