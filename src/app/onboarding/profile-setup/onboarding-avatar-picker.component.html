<div class="avatar-setup">
  <app-avatar [avatarUrl]="userInfo.avatarUrl" [username]="userInfo.username" size="xxl" [sizeInRem]="5" />
  <div class="avatar-choices" aria-label="Choose an avatar">
    <button type="button" class="avatar-choice" [class.selected]="!userInfo.avatarUrl" (click)="useInitials()">
      <app-avatar [avatarUrl]="null" [username]="userInfo.username" size="m" />
      <span class="sr-only">Use initials</span>
    </button>
    @for (avatarUrl of defaultAvatars; track avatarUrl) {
      <button type="button" class="avatar-choice" [class.selected]="avatarUrl === userInfo.avatarUrl" (click)="chooseAvatar(avatarUrl)">
        <app-avatar [avatarUrl]="avatarUrl" [username]="userInfo.username" size="m" />
        <span class="sr-only">Choose animal avatar</span>
      </button>
    }
  </div>
  <p>Your initials, or one of five drawings.</p>
</div>
