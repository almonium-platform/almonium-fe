<div class="card step profile-step">
  <div class="profile-heading">
    <h1>Make it yours</h1>
    <p>Both are already set — continue to keep them.</p>
  </div>

  @if (userInfo) {
    <app-onboarding-avatar-picker [userInfo]="userInfo" />
  }

  <div class="username-section">
    <span>Username</span>
    <div class="username-field"><app-username /></div>
    <p>Only used if you share a word pack.</p>
  </div>

  <div class="step-actions">
    <app-button label="Continue" (click)="submit()" appearance="solid" [loading$]="loading$" />
    <button type="button" class="back-link" (click)="back.emit()">Back</button>
  </div>
</div>
