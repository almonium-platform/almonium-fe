<div class="card step profile-step">
  <div class="profile-heading">
    <h1>Make it yours</h1>
    <p>Both of these are already set. Change them now or later in settings.</p>
  </div>

  @if (userInfo) {
    <div class="identity-preview">
      <app-onboarding-avatar-picker #avatarPicker [userInfo]="userInfo" />
      <div>
        <p class="identity-copy">Your initials, on your plum — or choose an animal.</p>
        <button type="button" class="avatar-link" (click)="avatarPicker.open()">Choose avatar</button>
      </div>
    </div>
  }

  <div class="username-section">
    <span>Username</span>
    <app-username />
    <p>Only used if you share a word pack.</p>
  </div>

  <app-button label="Continue" (click)="submit()" appearance="solid" class="w-full" [loading$]="loading$" />
</div>
