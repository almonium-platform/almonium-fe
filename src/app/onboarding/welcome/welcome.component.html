<div class="card step welcome">
  <div class="left-side">
    <app-emblem
      (click)="replayGifSubject.next()"
      [replayTrigger]="replayGifSubject"
      size="8rem"
    ></app-emblem>
  </div>
  <div class="right-side">
    <h4 i18n class="welcome-title">Welcome to Almonium</h4>
    <p i18n>
      A few quick questions, then you're set up.
    </p>
    <app-button
      label="Get Started" i18n-label
      [loading$]="loading$"
      (click)="startOnboarding()"
      class="w-full"
      appearance="solid"
    ></app-button>
  </div>
</div>
