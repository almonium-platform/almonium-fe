<section class="settings-avatar-picker" [class.member]="userInfo.premium">
  <!--
    28b: the letter is one option among six in this row, so it is drawn in the same monochrome
    material as the five engravings - the plain ground, never a hashed hue. A colour the user
    cannot choose has no place on a control whose whole job is choosing.

    30c: every tile is a pair - the engraving at 56px above, the schematic at 24px below - because
    the small one is what people will mostly see. One tap selects both; the ring wraps both.
  -->
  <div class="tile-row" role="group" aria-label="How you appear">
    <button
      type="button"
      class="tile letter-tile"
      [class.selected]="!userInfo.avatarUrl"
      [disabled]="busyUrl !== undefined"
      (click)="useLetter()"
      aria-label="Use your letter"
      [attr.aria-pressed]="!userInfo.avatarUrl"
    >
      <span class="disc disc-large avatar-ground"><span class="avatar-letter">{{ letter }}</span></span>
      <span class="disc disc-small avatar-ground"><span class="avatar-letter">{{ letter }}</span></span>
    </button>

    @for (choice of choices; track choice.path) {
      <button
        type="button"
        class="tile"
        [class.selected]="isSelected(choice)"
        [disabled]="busyUrl !== undefined"
        (click)="chooseAvatar(choice)"
        [attr.aria-label]="'Use the ' + choice.label + ' drawing'"
        [attr.aria-pressed]="isSelected(choice)"
      >
        <span class="disc disc-large avatar-plate">
          @if (userInfo.premium) {
            <span class="gradient-artwork" [style.mask-image]="choiceMask(choice)" [style.-webkit-mask-image]="choiceMask(choice)"></span>
          } @else {
            <img [src]="displayChoiceUrl(choice)" alt="" />
          }
        </span>
        <span class="disc disc-small avatar-plate">
          @if (userInfo.premium) {
            <span class="gradient-artwork avatar-schematic" [style.mask-image]="smallMask(choice)" [style.-webkit-mask-image]="smallMask(choice)"></span>
          } @else {
            <img class="avatar-schematic" [src]="choice.small" alt="" />
          }
        </span>
      </button>
    }
  </div>

  <p class="picker-caption">Your letter, or one of five drawings. The small one is how you appear in chats.</p>
</section>
