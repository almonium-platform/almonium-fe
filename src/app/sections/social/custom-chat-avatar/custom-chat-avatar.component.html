<div
  class="str-chat__avatar str-chat-angular__avatar str-chat__avatar--circle stream-chat__avatar--{{
    location
  }} stream-chat__avatar--{{
    initialsType === 'first-letter-of-first-word'
      ? 'one-letter'
      : 'multiple-letters'
  }} {{ discClass }}"
  [class.has-image]="showsImage"
  [class.saved-messages]="isSavedMessages"
  [class.brand-emblem]="isEmblem"
  [class.channel-crest]="!!crest"
  [style.--channel-crest-fill]="crest?.fill ?? null"
>
  @if (showsImage) {
    <img
      class="str-chat__avatar-image"
      data-testid="avatar-img"
      fetchpriority="high"
      src="{{ imageUrl || fallbackChannelImage }}"
      alt="{{ initials }}"
      (error)="isError = true"
    />
  } @else {
    <div data-testid="fallback-img" class="str-chat__avatar-fallback">
      @if (isSavedMessages) {
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M170 148a26 26 0 0 1 26-26h120a26 26 0 0 1 26 26v244l-86-64-86 64z"
                fill="none"
                stroke="currentColor"
                stroke-width="30"
                stroke-linejoin="round"
                stroke-linecap="round"/>
        </svg>
      } @else if (isEmblem) {
        <!-- 03: the emblem sits at 60% of the disc. It is circular, so it can run larger than a
             square glyph would; bare, its blades would read a size larger than the row. -->
        <span class="emblem-mark" aria-hidden="true"></span>
      } @else if (crest; as crest) {
        {{ crest.code }}
      } @else {
        {{ initials }}
      }
    </div>
  }
  <ng-template #fallback>
    <div data-testid="fallback-img" class="str-chat__avatar-fallback">
      {{ initials }}
    </div>
  </ng-template>
</div>
