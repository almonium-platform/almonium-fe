@if (coverUrl && !imageFailed) {
  <img
    [src]="coverUrl"
    [alt]="coverLabel"
    (error)="onImageError()"
  />
} @else {
  <div class="typographic-cover" [style.--cover-color]="color" role="img" [attr.aria-label]="coverLabel">
    <span class="color-field" aria-hidden="true"></span>
    <span class="ornament" aria-hidden="true">{{ 'ALMONIUM' }}</span>
    <strong>{{ title }}</strong>
    <span class="rule" aria-hidden="true"></span>
    <span class="author">{{ author }}</span>
  </div>
}
