<div class="parallel" [tuiSkeleton]="loading">
  <img
    src="../../../../assets/img/icons/parallel.svg"
    alt="parallel translation icon" i18n-alt
    [tuiHintAppearance]="'dark'"
    tuiHintDirection="bottom"
    [tuiHint]="showHint && tooltip"
  />
  <ng-template #tooltip>
    <div i18n>You can read this book in parallel mode.</div>
  </ng-template>
</div>
