name: Build and Deploy (Staging)

# Every push to `develop` deploys staging, and production follows once staging is up. The
# production bundle is built from the same commit (the Angular configuration differs), but
# the commit is not linted, tested or smoke-tested a second time. Set the repository variable
# PROD_FOLLOWS_STAGING to anything but `true` to hold production back; pushes then stop at
# staging until it is set again or `Build and Deploy (Production)` is dispatched by hand.

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'OPTIONAL: Specify an existing image tag to re-deploy.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  staging:
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  prod:
    needs: staging
    if: github.event_name == 'push' && vars.PROD_FOLLOWS_STAGING == 'true'
    permissions:
      contents: write # the deploy moves main to the commit production runs
      packages: write
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: prod
      verify: false
    secrets: inherit
