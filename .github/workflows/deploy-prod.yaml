name: Build and Deploy (Production)

# Production normally follows staging from the staging pipeline. This is the manual path:
# re-deploy a known image tag to roll back, or build the current `develop` head while
# PROD_FOLLOWS_STAGING is off.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'OPTIONAL: Specify an existing image tag to re-deploy.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prod:
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment: prod
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
