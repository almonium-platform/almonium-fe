name: Build and Deploy (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'OPTIONAL: Specify an existing image tag to re-deploy.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_tag.outputs.tag }}
      build_needed: ${{ steps.get_tag.outputs.build_needed }}
    steps:
      - name: Determine image tag
        id: get_tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [setup, quality]
    if: needs.setup.outputs.build_needed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/almonium-platform/almonium-fe:${{ needs.setup.outputs.image_tag }}
          build-args: |
            BUILD_CONFIGURATION=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.build_needed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build -- --configuration production

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, quality, build]
    if: always() && needs.setup.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: prod
    steps:
      - name: Checkout almonium-infra repository
        uses: actions/checkout@v5
        with:
          repository: almonium-platform/almonium-infra
          path: almonium-infra
          ssh-key: ${{ secrets.INFRA_REPO_CHECKOUT_KEY }}

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v4
        with:
          playbook: playbook-deploy-almonium-fe.yaml
          directory: almonium-infra/ansible
          key: ${{ secrets.CLOUD_KEY }}
          known_hosts: ${{ secrets.CLOUD_KNOWN_HOSTS }}
          options: |
            -i inventory/hosts.ini
            --limit almonium
            --extra-vars "deploy_environment=prod"
            --extra-vars "deploy_image_tag=${{ needs.setup.outputs.image_tag }}"
            --extra-vars "deploy_gh_actor=${{ github.actor }}"
            --extra-vars "deploy_gh_token=${{ secrets.GITHUB_TOKEN }}"
